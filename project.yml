name: BlazeFleet
options:
  bundleIdPrefix: do.blaze
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  xcodeVersion: "16.0"

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ULWH23TGXJ
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0

targets:
  BlazeFleet:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BlazeFleet
        excludes:
          - Resources/Info.plist
    info:
      path: BlazeFleet/Resources/Info.plist
      properties:
        CFBundleDisplayName: BlazeFleet
        CFBundleDevelopmentRegion: es
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UIRequiresFullScreen: true
        UILaunchScreen: {}
        UIBackgroundModes:
          - remote-notification
        NSLocationWhenInUseUsageDescription: BlazeFleet requiere tu ubicación para mostrar tu posición respecto a las unidades de la flota en el mapa.
        NSFaceIDUsageDescription: BlazeFleet requiere Face ID para autorizar comandos remotos críticos como el corte de ignición del motor.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: Config/BlazeFleet.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: do.blaze.fleet
        PRODUCT_NAME: BlazeFleet
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ULWH23TGXJ

  BlazeFleetTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BlazeFleetTests
    dependencies:
      - target: BlazeFleet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: do.blaze.fleet.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ULWH23TGXJ
